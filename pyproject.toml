[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uvbuilder"
version = "0.1.0"
description = "Minimal UV Lagrangians from protomodels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "sympy", "networkx", "unum", "pyslha"]

[project.scripts]
uvbuilder = "uvbuilder.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uvbuilder = ["data/*", "tools/reserved/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: long-running tests, deselected by default (run with: pytest -m slow)"]
